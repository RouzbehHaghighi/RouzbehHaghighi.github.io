{{- /* A figure from one of the papers: image from the page bundle, caption, and a link to the source paper. */ -}}
{{ $fig := .fig }}
{{ with .page.Resources.GetMatch $fig.src }}
  {{ $img := . }}
  {{ if gt .Width 1600 }}{{ $img = .Resize "1600x" }}{{ end }}
  <figure class="figure">
    <img src="{{ $img.RelPermalink }}" width="{{ $img.Width }}" height="{{ $img.Height }}" alt="{{ $fig.caption | plainify }}" loading="lazy">
    <figcaption>
      {{ $fig.caption }}
      {{ with $fig.source }}
        {{ with site.GetPage (printf "/publications/%s" .) }}
          {{ $url := .Params.paper_url }}{{ if and (not $url) .Params.doi }}{{ $url = printf "https://doi.org/%s" .Params.doi }}{{ end }}
          Source: {{ if $url }}<a href="{{ $url }}" rel="noopener">{{ .Params.publication.name }}, {{ .Date.Format "2006" }}</a>{{ else }}{{ .Params.publication.name }}, {{ .Date.Format "2006" }}{{ end }}.
        {{ end }}
      {{ end }}
    </figcaption>
  </figure>
{{ end }}
