{{ define "main" }}
<header class="page-head">
  <h1>{{ .Title }}</h1>
</header>
<ol class="rows">
  {{ range .RegularPages.ByDate.Reverse }}
    <li>
      <div><time class="date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2006" }}</time></div>
      <div>
        <a href="{{ .RelPermalink }}"><strong>{{ .Title }}</strong></a>
        {{ with .Summary }}<p class="muted">{{ . }}</p>{{ end }}
      </div>
    </li>
  {{ end }}
</ol>
{{ end }}
