# Experience: shown on the CV page.
experience:
  - role: Graduate Student Research Assistant
    org: University of Michigan-Dearborn, Dept. of ECE
    location: Dearborn, MI, USA
    start: 2023-08-01
    highlights:
      - Hosting-capacity and reliability frameworks for large, uncertain AI data-center loads in distribution networks, with grid-aware load coordination and energy-storage strategies.
      - Fine-tuned and multi-agent LLMs for surrogate scheduling, economic dispatch, decentralized Volt/VAR control, and reliability-oriented clustering of DER-rich active distribution networks.
      - Stochastic reliability and resource-adequacy assessment for grids dominated by inverter-based resources.
      - Stackelberg–Bayesian and deep-reinforcement-learning models for second-life battery investment and EV charging under AI-driven load growth.
      - Contributor to NSF project “Enhancing Grid Reliability and Stability with Distributed Energy Resources” (Award #2321661).
  - role: Power System Engineering Intern, Transmission Technical Studies
    org: Danovo Energy Solutions (Quanta Technology LLC)
    location: Raleigh, NC, USA
    start: 2025-05-01
    end: 2025-08-31
    highlights:
      - Transmission system planning and interconnection studies using PSLF, TARA, and PSS/E.
      - Contributed to the design, optimization, and operational analysis of transmission systems.
  - role: Graduate Student Instructor / Teaching Assistant
    org: University of Michigan-Dearborn, Dept. of ECE
    location: Dearborn, MI, USA
    start: 2024-01-01
    end: 2026-04-30
    highlights:
      - Five undergraduate and graduate courses; see the Teaching page.
  - role: Research Assistant
    org: Power Systems Research Center, Amirkabir University of Technology
    location: Tehran, Iran
    start: 2019-09-01
    end: 2022-12-31
    highlights:
      - Short- and medium-term forecasting of wind speed, solar irradiance, load, and battery state of charge for optimal control of a hybrid PV/wind/battery microgrid.
      - ML-based forecasting integrated into the energy management strategy to improve energy efficiency and dynamic control performance.

