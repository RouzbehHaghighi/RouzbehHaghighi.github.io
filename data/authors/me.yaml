bio: |
  Rouzbeh Haghighi is a Ph.D. candidate in Electrical, Electronics & Computer Engineering at the
  University of Michigan-Dearborn, advised by Prof. Wencong Su. His research sits at the
  intersection of power-system reliability and artificial intelligence: large language models and
  reinforcement learning as operational decision-makers for the grid, and hosting-capacity and
  reliability frameworks for integrating large, uncertain AI data-center loads into distribution
  and transmission networks. In 2025 he carried out transmission planning and interconnection
  studies in PSLF, TARA, and PSS/E as a Power System Engineering Intern with Quanta Technology.

