# Experience: shown on the CV page.
experience:
  - role: Power System Engineering Intern — Transmission Technical Studies
    org: Danovo Energy Solutions (Quanta Technology LLC)
    location: Raleigh, NC, USA
    start: 2025-05-01
    end: 2025-08-31
    highlights:
      - Performed transmission system planning and interconnection studies using PSLF, TARA, and PSS/E.
      - Contributed to the design, optimization, and operational analysis of transmission systems.
  - role: Graduate Student Research Assistant (GSRA)
    org: University of Michigan-Dearborn, Dept. of ECE
    location: Dearborn, MI, USA
    start: 2023-08-01
    highlights:
      - "Conducting doctoral research at the intersection of power-system reliability and artificial intelligence along two complementary directions: AI for the grid, LLMs and reinforcement learning as operational decision-makers, and the grid for AI, integrating large-scale, uncertain AI data-center loads into distribution and transmission networks."
      - Contributor to NSF Project “Enhancing Grid Reliability and Stability with Distributed Energy Resources” (Award #2321661).
      - "Grid Integration of AI Data-Center Loads: hosting-capacity and reliability frameworks for large, uncertain AI data-center demand, with grid-aware load coordination and energy-storage strategies."
      - "LLMs as Power-System Decision-Makers: fine-tuned and multi-agent LLMs for surrogate scheduling, economic dispatch, decentralized Volt/VAR control, and reliability-oriented clustering of DER-rich active distribution networks."
      - "Reliability Assessment under High IBR Penetration: stochastic, probabilistic frameworks for reliability and resource-adequacy metrics on grids dominated by inverter-based resources."
      - "Strategic and economic modeling of storage and carbon policy: Stackelberg–Bayesian and deep-reinforcement-learning models for second-life battery investment and EV charging under AI-driven load growth and carbon regulation."
  - role: Graduate Student Instructor (GSI) / Teaching Assistant
    org: University of Michigan-Dearborn, Dept. of ECE
    location: Dearborn, MI, USA
    start: 2024-01-01
    end: 2026-04-30
    highlights:
      - "ECE 5462, Electrical Aspects of Hybrid Vehicles (Fall 2024)."
      - "ECE 311, Electronic Circuits I (Winter 2024)."
      - "ECE 305, Introduction to Electrical Engineering (Winter 2024, Fall 2024)."
      - "ECE 473, Embedded Systems (Winter 2024)."
      - "ECE 210, Circuits, recitation (Fall 2025, Winter 2026, Fall 2026)."
  - role: Research Assistant
    org: Power Systems Research Center, Amirkabir University of Technology
    location: Tehran, Iran
    start: 2019-09-01
    end: 2022-12-31
    highlights:
      - Developed short- and medium-term forecasting models for wind speed, solar irradiance, load, and battery state of charge to enable optimal control of a hybrid PV/wind/battery microgrid.
      - Improved system energy efficiency and dynamic control performance by integrating ML-based forecasting into the energy management strategy.
      - "Generation Expansion Planning with Carbon-Reduction Policies: a game-theoretic optimization model for long-term generation expansion, with carbon curtailment penalties and incentive mechanisms."
      - "Optimization-Based MPPT for Photovoltaic Systems: a bio-inspired MPPT algorithm for PV panels under partial shading."

